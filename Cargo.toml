[workspace]
resolver = "3"
members = ["crates/queens_core", "crates/queens_cli", "crates/queens_app"]

[workspace.package]
version = "0.2.8"
edition = "2024"
# Matches rust-toolchain.toml. Kept here as well so clippy's incompatible_msrv
# lint knows what it may not use.
rust-version = "1.95"
license = "MIT OR Apache-2.0"

# "Every public item carries a doc comment" is a convention this repo already
# holds itself to; stating it here is what makes the editor and CI say so
# rather than a reviewer. CI's `clippy -- -D warnings` promotes it to an error.
[workspace.lints.rust]
missing_docs = "warn"

[workspace.dependencies]
queens_core = { path = "crates/queens_core" }
# Default features pull in the whole 3D pipeline (bevy_pbr, bevy_gltf, KTX2,
# morph animation), none of which this 2D UI game reaches; dropping them cuts
# the release binary by about a fifth.
# `system_clipboard` is off by default, and without it `Clipboard` writes to an
# in-process buffer the rest of the desktop never sees.
# `wav` is the only decoder built: the four cues in `audio.rs` are short enough
# that a compressed format would cost more in decoder than it saved in bytes.
bevy = { version = "0.19.1", default-features = false, features = [
    "ui",
    "system_clipboard",
    "bevy_audio",
    "wav",
] }
serde = { version = "1", features = ["derive"] }
ron = "0.12"
dirs = "7"

# Bevy is unusably slow in an unoptimised debug build; optimise dependencies
# hard while keeping our own crates quick to compile.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
# No dependency here is ever stepped through in a debugger, and its debuginfo
# is most of both the link time and the size of target/. Our own crates keep
# theirs.
debug = false

# Proc macros and build scripts are compiled once and then run on every crate
# that uses them; optimise them and skip their debuginfo too.
[profile.dev.build-override]
opt-level = 3
debug = false

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
opt-level = "z"
panic = "abort"
