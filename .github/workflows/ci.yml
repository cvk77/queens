name: CI

on:
  push:
    branches: [master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  # Bevy links a lot; keep incremental artefacts out of the cache.
  CARGO_INCREMENTAL: 0
  # Nothing in CI is ever opened in a debugger, and debuginfo is most of the
  # size of the cache three runners have to save and restore.
  CARGO_PROFILE_DEV_DEBUG: 0
  CARGO_PROFILE_TEST_DEBUG: 0

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Never interrupt a tag run: it may be midway through creating the release.
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  check:
    name: Check ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            os: ubuntu-latest
          - name: windows-x86_64
            os: windows-latest
          - name: macos-aarch64
            os: macos-latest

    steps:
      - uses: actions/checkout@v4

      # First, and before anything is installed or restored: formatting needs
      # nothing but the toolchain, so a formatting failure should cost seconds.
      - name: Check formatting
        if: runner.os == 'Linux'
        run: cargo fmt --all --check

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            pkg-config libx11-dev libasound2-dev libudev-dev \
            libxkbcommon-dev libwayland-dev

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.os }}
          # clippy runs with -D warnings; without this a single warning throws
          # away the whole Bevy dependency build along with it.
          cache-on-failure: true
          # A Bevy-sized cache per OS per key already crowds the 10 GB repo
          # limit; a pull request that also writes one evicts the caches every
          # other job depends on. Pull requests restore, they do not save.
          save-if: ${{ github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/v') }}

      # One authority on lint is enough: the same warnings fire on every
      # platform, and running it three times only spends runner minutes.
      - name: Lint
        if: runner.os == 'Linux'
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      # Covers queens_core's logic and the app's unit tests. Neither needs a
      # window, so this runs on a headless runner unchanged.
      - name: Test
        run: cargo test --workspace --locked

      # The tests build every library and test target but link neither binary.
      # Once they are built this is only the link step, and it is the only
      # thing that catches a missing native library on this platform.
      - name: Build the binaries
        run: cargo build --workspace --locked

  generator:
    name: Audit generated puzzles
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
          save-if: ${{ github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/v') }}

      # Every puzzle is checked for a unique solution, contiguous regions, a
      # stable rating and byte-identical regeneration from its seed. queens_cli
      # has no Bevy dependency, so this needs no system libraries and is quick.
      - name: Generate and audit a spread of puzzles
        run: >
          cargo run --release --locked -p queens_cli --
          bench --sizes 5-10 --difficulties all --count 5

  build:
    name: Build ${{ matrix.name }}
    # Release binaries are only ever consumed by a release. Building them on
    # every push costs three runners a full LTO compile for artefacts nobody
    # downloads; the manual trigger is there to produce one on demand. A
    # `packaging` label does the same for a pull request that touches this
    # workflow or packaging/, so a mistake there fails on the change that
    # caused it rather than at tag time.
    if: >
      startsWith(github.ref, 'refs/tags/v') ||
      github.event_name == 'workflow_dispatch' ||
      contains(github.event.pull_request.labels.*.name, 'packaging')
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      # Signed provenance for each archive. Nothing about SmartScreen or
      # Gatekeeper depends on this; it is what lets someone verify a download
      # came from this workflow and this commit.
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            os: ubuntu-latest
          - name: windows-x86_64
            os: windows-latest
          - name: macos-aarch64
            os: macos-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            pkg-config libx11-dev libasound2-dev libudev-dev \
            libxkbcommon-dev libwayland-dev

      - uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.os }}
          save-if: ${{ github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/v') }}

      # Each runner builds for its own host, so no target flag: it would only
      # bury the binaries a directory deeper for nothing.
      - name: Build the game and the generator tool
        run: cargo build --release --workspace --locked

      # A throwaway keychain that dies with the runner, so the certificate
      # only ever lives in this job's own VM.
      - name: Import macOS signing certificate
        if: runner.os == 'macOS'
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PWD: ${{ secrets.MACOS_CERTIFICATE_PWD }}
        run: |
          echo "$MACOS_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security create-keychain -p "actions" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "actions" build.keychain
          security set-keychain-settings -t 3600 -u build.keychain
          security import "$RUNNER_TEMP/certificate.p12" -k build.keychain \
            -P "$MACOS_CERTIFICATE_PWD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "actions" build.keychain
          security list-keychains -d user -s build.keychain \
            $(security list-keychains -d user | tr -d '"')
          rm "$RUNNER_TEMP/certificate.p12"

      # `queens.app` in a DMG, notarized: the game is a GUI app someone
      # double-clicks after downloading, which is exactly what Gatekeeper's
      # quarantine check is strictest about. `queens-gen` stays a CLI tool in
      # the tar.gz/zip below; that friction doesn't apply to it the same way.
      - name: Package, sign and notarize the game (macOS)
        if: runner.os == 'macOS'
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          echo "$APPLE_API_KEY" | base64 --decode > "$RUNNER_TEMP/apple_api_key.p8"
          VERSION=$(grep '^version' Cargo.toml | head -1 | cut -d'"' -f2)
          packaging/macos/build_dmg.sh \
            --version "$VERSION" \
            --binary target/release/queens \
            --identity "$APPLE_SIGNING_IDENTITY" \
            --api-key "$RUNNER_TEMP/apple_api_key.p8" \
            --api-key-id "$APPLE_API_KEY_ID" \
            --api-issuer "$APPLE_API_ISSUER" \
            --out "queens-${{ matrix.name }}.dmg"
          rm "$RUNNER_TEMP/apple_api_key.p8"

      - name: Package (unix)
        if: runner.os != 'Windows'
        run: |
          tar -czf "queens-${{ matrix.name }}.tar.gz" \
            -C target/release queens queens-gen

      - name: Package (windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $binaries = "target/release/queens.exe", "target/release/queens-gen.exe"
          Compress-Archive -Path $binaries -DestinationPath "queens-${{ matrix.name }}.zip"

      - name: Attest the build provenance
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: queens-${{ matrix.name }}.*

      - uses: actions/upload-artifact@v7
        with:
          name: queens-${{ matrix.name }}
          path: queens-${{ matrix.name }}.*
          if-no-files-found: error

  release:
    name: Publish a release
    # Only for a pushed version tag, and only once the binaries and the checks
    # are known good.
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [check, generator, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      # The Windows binaries are unsigned, so a cautious player has nothing to
      # check them against otherwise. See README.md for what this does and does
      # not buy.
      - name: Checksum the artefacts
        working-directory: artifacts
        run: sha256sum queens-* > SHA256SUMS

      - name: Attach the binaries to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "${{ github.ref_name }}"
          --repo "${{ github.repository }}"
          --title "${{ github.ref_name }}"
          --generate-notes
          artifacts/*
