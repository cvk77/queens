[package]
name = "queens_app"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "The Queens puzzle game"

[[bin]]
name = "queens"
path = "src/main.rs"

[features]
# Links Bevy dynamically for much faster incremental rebuilds during
# development: `cargo run -p queens_app --features dev`.
dev = ["bevy/dynamic_linking"]

[dependencies]
queens_core = { workspace = true }
bevy = { workspace = true }
serde = { workspace = true }
ron = { workspace = true }

# Neither of these has an answer in a browser. `dirs` has no data directory to
# name, and `ureq` pulls `ring`, which needs a C toolchain to build for wasm
# and sockets a browser will not give it. The itch build is always the current
# version, so there is no update for it to check for either.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
ureq = { version = "3.4.1", features = ["json"] }
dirs = { workspace = true }

# localStorage stands in for the data directory. An itch.io page shares its
# origin with every other game on that domain, hence the namespaced key.
[target.'cfg(target_arch = "wasm32")'.dependencies]
web-sys = { version = "0.3", features = ["Storage", "Window"] }

[lints]
workspace = true
